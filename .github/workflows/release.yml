# Builds release binaries on GitHub-hosted runners (free tier) and, for a
# `v*` tag, publishes them as a GitHub Release.
#
#   Linux   x86_64  .tar.gz, .deb, .rpm   (built on Ubuntu 22.04 → glibc 2.35+)
#   Windows x86_64  .zip                  (static CRT, no VC++ redist needed)
#   macOS   universal (Apple Silicon + Intel) .dmg with CDisplay.app, ad-hoc signed
#
# Release: bump `version` in Cargo.toml, commit, then `git tag v0.2.0 && git push --tags`.
# Test build without releasing: Actions → Release → "Run workflow"; the files
# are attached to the run as artifacts.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    name: Check version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - id: v
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -n1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [[ "$GITHUB_REF" == refs/tags/v* && "${GITHUB_REF_NAME#v}" != "$version" ]]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match Cargo.toml version $version"
            exit 1
          fi

  linux:
    name: Linux (tar.gz, deb, rpm)
    needs: version
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libx11-dev libxkbcommon-dev libwayland-dev
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm
      - name: Test
        run: cargo test --release --locked
      - name: Build
        run: cargo build --release --locked
      - name: Package
        run: |
          mkdir -p dist
          name="cdisplay-rs-$VERSION-x86_64-linux"
          mkdir "$name"
          cp target/release/cdisplay-rs README.md LICENSE packaging/cdisplay-rs.desktop "$name/"
          tar -czf "dist/$name.tar.gz" "$name"
          cargo deb --no-build --locked --output dist/
          cargo generate-rpm --output dist/
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-linux
          path: dist/*
          if-no-files-found: error

  windows:
    name: Windows (zip)
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      # Link the C runtime statically so the .exe runs without the VC++ redistributable.
      RUSTFLAGS: -C target-feature=+crt-static
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Test
        run: cargo test --release --locked
      - name: Build
        run: cargo build --release --locked
      - name: Package
        shell: pwsh
        run: |
          $name = "cdisplay-rs-$env:VERSION-x86_64-windows"
          New-Item -ItemType Directory -Force -Path $name, dist | Out-Null
          Copy-Item target/release/cdisplay-rs.exe, README.md, LICENSE -Destination $name
          Compress-Archive -Path $name -DestinationPath "dist/$name.zip"
          Get-ChildItem dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-windows
          path: dist/*
          if-no-files-found: error

  macos:
    name: macOS (universal dmg)
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Test
        # --target keeps the test build in the same dir as the release build (no rebuild).
        run: cargo test --release --locked --target aarch64-apple-darwin
      - name: Build
        run: |
          cargo build --release --locked --target aarch64-apple-darwin
          cargo build --release --locked --target x86_64-apple-darwin
          lipo -create -output cdisplay-rs \
            target/aarch64-apple-darwin/release/cdisplay-rs \
            target/x86_64-apple-darwin/release/cdisplay-rs
          lipo -info cdisplay-rs
      - name: Package
        run: |
          app=staging/CDisplay.app
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources" dist
          cp cdisplay-rs "$app/Contents/MacOS/"
          sed "s/@VERSION@/$VERSION/g" packaging/macos/Info.plist > "$app/Contents/Info.plist"
          plutil -lint "$app/Contents/Info.plist"
          # Ad-hoc signature (free). Not notarized: see the release notes for first launch.
          codesign --force --deep --sign - "$app"
          cp README.md LICENSE staging/
          ln -s /Applications staging/Applications
          dmg="dist/cdisplay-rs-$VERSION-universal-macos.dmg"
          # hdiutil is occasionally "Resource busy" on hosted runners; retry.
          for i in 1 2 3 4 5; do
            hdiutil create -volname "CDisplay" -srcfolder staging -ov -format UDZO "$dmg" && break
            echo "hdiutil failed (attempt $i), retrying"; sleep 5
          done
          test -f "$dmg"
          ls -l dist
      - uses: actions/upload-artifact@v7
        with:
          name: dist-macos
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish GitHub Release
    needs: [linux, windows, macos]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: dist-*
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          body: |
            ## Downloads

            | System | File |
            |---|---|
            | Windows 10/11 (x64) | `cdisplay-rs-…-x86_64-windows.zip` |
            | macOS 11+ (Apple Silicon & Intel) | `cdisplay-rs-…-universal-macos.dmg` |
            | Debian / Ubuntu | `cdisplay-rs_…_amd64.deb` → `sudo apt install ./cdisplay-rs_*.deb` |
            | Fedora / openSUSE / RHEL | `cdisplay-rs-….x86_64.rpm` → `sudo dnf install ./cdisplay-rs-*.rpm` |
            | Other Linux (glibc 2.35+) | `cdisplay-rs-…-x86_64-linux.tar.gz` |

            The Windows and macOS builds are not code-signed by a paid certificate:
            * **Windows:** SmartScreen may warn; choose *More info → Run anyway*.
            * **macOS:** drag *CDisplay* to Applications, then on first launch right-click → *Open*,
              or allow it under *System Settings → Privacy & Security*. Alternatively:
              `xattr -dr com.apple.quarantine /Applications/CDisplay.app`
